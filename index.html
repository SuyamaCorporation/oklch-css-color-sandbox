<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKLCH CSS カラー サンドボックス</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4">
<div class="max-w-5xl mx-auto">
  <h1 class="text-2xl font-bold text-center mb-2 text-violet-400">OKLCH CSS カラー サンドボックス</h1>
  <p class="text-center text-gray-400 text-sm mb-4">知覚均等色空間 OKLCH でカラー設計</p>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    <!-- Controls -->
    <div class="flex flex-col gap-3">
      <div class="bg-gray-900 rounded-lg p-4 border border-gray-700">
        <h2 class="font-semibold text-violet-300 mb-3">OKLCH スライダー</h2>

        <label class="text-xs text-gray-400 flex justify-between"><span>L — 明度 (Lightness)</span><span id="lVal" class="text-violet-300 font-mono">0.65</span></label>
        <input id="lSlider" type="range" min="0" max="100" value="65" class="w-full accent-violet-500 mb-3" aria-label="明度">

        <label class="text-xs text-gray-400 flex justify-between"><span>C — 彩度 (Chroma)</span><span id="cVal" class="text-violet-300 font-mono">0.150</span></label>
        <input id="cSlider" type="range" min="0" max="40" value="15" class="w-full accent-violet-500 mb-3" aria-label="彩度">

        <label class="text-xs text-gray-400 flex justify-between"><span>H — 色相 (Hue 0-360°)</span><span id="hVal" class="text-violet-300 font-mono">280°</span></label>
        <input id="hSlider" type="range" min="0" max="360" value="280" class="w-full accent-violet-500 mb-3" aria-label="色相">

        <div id="gamutWarning" class="hidden text-xs bg-red-900 text-red-200 rounded p-2 mb-2">⚠ sRGB ガモット外 — 表示色は近似値</div>
        <div id="cssOutput" class="font-mono text-sm bg-gray-800 rounded p-2 text-green-300 select-all cursor-pointer" title="クリックでコピー"></div>
      </div>

      <!-- Color info -->
      <div class="bg-gray-900 rounded-lg p-4 border border-gray-700">
        <h2 class="font-semibold text-violet-300 mb-2">変換値</h2>
        <div id="colorInfo" class="space-y-1 text-xs font-mono"></div>
      </div>

      <!-- Harmony -->
      <div class="bg-gray-900 rounded-lg p-4 border border-gray-700">
        <h2 class="font-semibold text-violet-300 mb-2">カラーハーモニー</h2>
        <div id="harmony" class="grid grid-cols-3 gap-2"></div>
      </div>
    </div>

    <!-- Previews -->
    <div class="flex flex-col gap-3">
      <div class="bg-gray-900 rounded-lg p-4 border border-gray-700">
        <h2 class="font-semibold text-violet-300 mb-3">プレビュー</h2>
        <div class="grid grid-cols-2 gap-3 mb-3">
          <div>
            <div class="text-xs text-gray-400 mb-1">メインカラー</div>
            <div id="mainPreview" class="h-24 rounded-lg border border-gray-600"></div>
          </div>
          <div>
            <div class="text-xs text-gray-400 mb-1">補色 (H+180°)</div>
            <div id="compPreview" class="h-24 rounded-lg border border-gray-600"></div>
          </div>
        </div>
        <div>
          <div class="text-xs text-gray-400 mb-1">明度スケール (L: 0.1→0.9)</div>
          <div id="lightnessScale" class="flex gap-1 h-8"></div>
        </div>
      </div>

      <!-- OKLCH vs HSL comparison -->
      <div class="bg-gray-900 rounded-lg p-4 border border-gray-700">
        <h2 class="font-semibold text-violet-300 mb-2">OKLCH vs HSL 知覚均等性</h2>
        <p class="text-xs text-gray-400 mb-2">HSLで同じL値でも知覚輝度は異なる。OKLCHは均等</p>
        <div id="perceptualComp" class="space-y-2"></div>
      </div>

      <!-- Hue wheel -->
      <div class="bg-gray-900 rounded-lg p-4 border border-gray-700">
        <h2 class="font-semibold text-violet-300 mb-2">色相リング (C=0.15)</h2>
        <canvas id="hueWheel" width="280" height="60" class="w-full rounded" aria-label="色相リング"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
// OKLCH to sRGB conversion
function oklabToLinRgb(L,a,b) {
  const l_=(L+0.3963377774*a+0.2158037573*b)**3;
  const m_=(L-0.1055613458*a-0.0638541728*b)**3;
  const s_=(L-0.0894841775*a-1.2914855480*b)**3;
  return [
    4.0767416621*l_-3.3077115913*m_+0.2309699292*s_,
    -1.2684380046*l_+2.6097574011*m_-0.3413193965*s_,
    -0.0041960863*l_-0.7034186147*m_+1.7076147010*s_
  ];
}
function linToSrgb(x){return x<=0.0031308?12.92*x:1.055*Math.pow(x,1/2.4)-0.055;}
function oklchToRgb(L,C,H) {
  const hRad=H*Math.PI/180;
  const a=C*Math.cos(hRad),b=C*Math.sin(hRad);
  const [lr,lg,lb]=oklabToLinRgb(L,a,b);
  const r=Math.round(Math.min(255,Math.max(0,linToSrgb(lr)*255)));
  const g=Math.round(Math.min(255,Math.max(0,linToSrgb(lg)*255)));
  const bl=Math.round(Math.min(255,Math.max(0,linToSrgb(lb)*255)));
  const inGamut=lr>=0&&lr<=1&&lg>=0&&lg<=1&&lb>=0&&lb<=1;
  return {r,g,b:bl,inGamut};
}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0,s=0,l=(mx+mn)/2;if(d>0){s=l>0.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;}return[Math.round(h*360),Math.round(s*100),Math.round(l*100)];}

function getVals() {
  return {
    L: parseInt(document.getElementById('lSlider').value)/100,
    C: parseInt(document.getElementById('cSlider').value)/100,
    H: parseInt(document.getElementById('hSlider').value),
  };
}

function update() {
  const {L,C,H}=getVals();
  document.getElementById('lVal').textContent=L.toFixed(2);
  document.getElementById('cVal').textContent=C.toFixed(3);
  document.getElementById('hVal').textContent=`${H}°`;

  const {r,g,b,inGamut}=oklchToRgb(L,C,H);
  const hex=rgbToHex(r,g,b);
  const [hl,hs,hsl]=rgbToHsl(r,g,b);

  document.getElementById('gamutWarning').classList.toggle('hidden',inGamut);
  const css=`oklch(${L.toFixed(2)} ${C.toFixed(3)} ${H})`;
  document.getElementById('cssOutput').textContent=css;

  document.getElementById('colorInfo').innerHTML=`
    <div class="flex justify-between"><span class="text-gray-400">HEX</span><span class="text-pink-300">${hex.toUpperCase()}</span></div>
    <div class="flex justify-between"><span class="text-gray-400">RGB</span><span>${r}, ${g}, ${b}</span></div>
    <div class="flex justify-between"><span class="text-gray-400">HSL</span><span>${hl}°, ${hs}%, ${hsl}%</span></div>
    <div class="flex justify-between"><span class="text-gray-400">CSS</span><span class="text-green-300">${css}</span></div>
    <div class="flex justify-between"><span class="text-gray-400">ガモット</span><span class="${inGamut?'text-green-400':'text-red-400'}">${inGamut?'sRGB内':'sRGB外'}</span></div>
  `;

  document.getElementById('mainPreview').style.background=hex;

  // Complementary
  const {r:cr,g:cg,b:cb}=oklchToRgb(L,C,(H+180)%360);
  const compHex=rgbToHex(cr,cg,cb);
  document.getElementById('compPreview').style.background=compHex;

  // Lightness scale
  const scale=document.getElementById('lightnessScale');
  scale.innerHTML='';
  for(let i=1;i<=9;i++){
    const lv=i*0.1;
    const {r:sr,g:sg,b:sb}=oklchToRgb(lv,C,H);
    const sh=rgbToHex(sr,sg,sb);
    const div=document.createElement('div');
    div.className='flex-1 h-8 rounded cursor-pointer';
    div.style.background=sh;
    div.title=`L=${lv.toFixed(1)} → ${sh}`;
    scale.appendChild(div);
  }

  updateHarmony(L,C,H);
  drawHueWheel(L,C,H);
  updatePerceptual(L,C,H);
}

function updateHarmony(L,C,H) {
  const schemes=[
    {name:'補色',hues:[H,(H+180)%360]},
    {name:'三色',hues:[H,(H+120)%360,(H+240)%360]},
    {name:'四色',hues:[H,(H+90)%360,(H+180)%360,(H+270)%360]},
  ];
  document.getElementById('harmony').innerHTML=schemes.map(({name,hues})=>`
    <div class="rounded-lg overflow-hidden border border-gray-700">
      <div class="flex h-8">${hues.map(h=>{const{r,g,b}=oklchToRgb(L,C,h);return`<div class="flex-1" style="background:${rgbToHex(r,g,b)}" title="${Math.round(h)}°"></div>`;}).join('')}</div>
      <div class="text-xs text-center text-gray-400 py-1">${name}</div>
    </div>
  `).join('');
}

function updatePerceptual(L,C,H) {
  const el=document.getElementById('perceptualComp');
  const hslHues=[0,60,120,180,240,300];
  el.innerHTML=`<div class="flex gap-1 h-6 mb-1">
    ${hslHues.map(h=>{const{r,g,b}=oklchToRgb(L,C,h);return`<div class="flex-1 rounded" style="background:${rgbToHex(r,g,b)}" title="OKLCH H=${h}°"></div>`;}).join('')}
  </div>
  <div class="text-xs text-gray-400 mb-1">OKLCH H変化 (L=${L.toFixed(2)} C=${C.toFixed(2)}) — 均等な知覚輝度</div>
  <div class="flex gap-1 h-6 mb-1">
    ${hslHues.map(h=>`<div class="flex-1 rounded" style="background:hsl(${h},70%,${Math.round(L*100)}%)" title="HSL H=${h}°"></div>`).join('')}
  </div>
  <div class="text-xs text-gray-400">HSL H変化 (L=${Math.round(L*100)}%) — 知覚輝度がバラバラ</div>`;
}

function drawHueWheel(L,C,selH) {
  const canvas=document.getElementById('hueWheel');
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H_=canvas.height;
  for(let x=0;x<W;x++){
    const h=(x/W)*360;
    const{r,g,b}=oklchToRgb(L,0.15,h);
    ctx.fillStyle=rgbToHex(r,g,b);
    ctx.fillRect(x,0,2,H_);
  }
  const selX=(selH/360)*W;
  ctx.fillStyle='white'; ctx.fillRect(selX-1,0,3,H_);
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(selX-1,0,3,H_);
  ctx.strokeStyle='white'; ctx.lineWidth=2;
  ctx.strokeRect(selX-3,2,6,H_-4);
}

document.getElementById('cssOutput').addEventListener('click',()=>{
  const {L,C,H}=getVals();
  navigator.clipboard&&navigator.clipboard.writeText(`oklch(${L.toFixed(2)} ${C.toFixed(3)} ${H})`);
});
['lSlider','cSlider','hSlider'].forEach(id=>document.getElementById(id).addEventListener('input',update));

update();
</script>
</body>
</html>
